[mcp_servers.cutbridge]
command = "node"
# Replace with your installation's absolute path, or run npm run setup:print.
args = ["/absolute/path/to/cutbridge/scripts/mcp.mjs"]
startup_timeout_sec = 60
tool_timeout_sec = 180
env_vars = ["CODEX_THREAD_ID", "CODEX_SESSION_ID"]
[mcp_servers.cutbridge.env]
CUTBRIDGE_HOST = "codex"
